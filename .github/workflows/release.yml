name: Release package

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      tarball: ${{ steps.version.outputs.tarball }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26.0.0'
          package-manager-cache: false
      - name: Resolve source and require release tags on the default branch
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          fi
      - name: Match tag to package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release/version.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:release
      - run: npm run test:release
      - name: Pack and inspect the distributable
        env:
          TARBALL: ${{ steps.version.outputs.tarball }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          mkdir -p dist/release
          npm pack --dry-run
          npm pack --pack-destination dist/release
          node scripts/release/check-tarball.mjs "dist/release/$TARBALL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.package.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26.0.0'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: dist/release
      - name: Create or complete an unpublished draft without replacing assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: node scripts/release/publish-draft.mjs
